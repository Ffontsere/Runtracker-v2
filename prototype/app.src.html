<title>RunTracker Força i Cos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de 560 px com una fitxa d'entrenament, barra inferior fixa amb 2 pestanyes. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#F5F8F6; --ink:#15201B; --muted:#56635D; --line:#D3DBD7;
  --accent:#1D664D; --accent-ink:#FFFFFF; --accent-soft:#DAEAE2;
  --level:#9A6216; --level-soft:#F4E6CF;
  --ok:#2A7A4B; --warn:#A6531A; --warn-soft:#F7E3D3; --bad:#B03838;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#172019; --sunk:#121a16; --ink:#E5ECE8; --muted:#9BA8A2; --line:#2A3631;
  --accent:#5DBE96; --accent-ink:#0B1712; --accent-soft:#1B3A2E;
  --level:#E3A75C; --level-soft:#3A2B16;
  --ok:#6CC28F; --warn:#E28C4D; --warn-soft:#3A2416; --bad:#E57373; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#172019; --sunk:#121a16; --ink:#E5ECE8; --muted:#9BA8A2; --line:#2A3631;
  --accent:#5DBE96; --accent-ink:#0B1712; --accent-soft:#1B3A2E;
  --level:#E3A75C; --level-soft:#3A2B16;
  --ok:#6CC28F; --warn:#E28C4D; --warn-soft:#3A2416; --bad:#E57373; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:18px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;line-height:1}
.brand span{color:var(--accent)}
.proto{font-size:12px;color:var(--muted);text-align:right}
h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
/* Capçalera de la sessió */
.sess{display:flex;flex-direction:column;gap:10px}
.sess-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctx{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chip.ok::before,.chip.warn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.warn::before{background:var(--warn)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:6px}
.note{font-size:13.5px;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:9px 12px;border-left:3px solid var(--warn)}
.note.info{background:var(--sunk);border-left-color:var(--line)}
/* Fitxa d'exercici */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-name{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.1}
.ladder{display:flex;gap:3px;margin-top:6px}
.ladder i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.ladder i.done{background:var(--accent)}
.ladder i.now{background:var(--level)}
.lvl{font-size:12px;font-weight:600;color:var(--level);background:var(--level-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.cue{font-size:13.5px;color:var(--muted);margin:0}
.target{font-size:13px;color:var(--muted)}
.target b{color:var(--ink);font-weight:600}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.set{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.set .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.step{display:flex;align-items:center;gap:4px}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;font-weight:600}
.step output{font-family:var(--display);font-weight:600;font-size:28px;min-width:34px;text-align:center;font-variant-numeric:tabular-nums}
.set.hit output{color:var(--accent)}
.timer{margin-top:4px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--accent)}
.timer.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rir{display:flex;gap:4px}
.rir button{min-width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}
.rir button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--warn)}
details summary{font-size:13px;color:var(--accent);cursor:pointer;font-weight:500}
.verdict{font-size:13.5px;border-radius:10px;padding:8px 12px;background:var(--sunk)}
.verdict.up{background:var(--level-soft);color:var(--ink);border-left:3px solid var(--level)}
.verdict.down,.verdict.pain{background:var(--warn-soft);border-left:3px solid var(--warn)}
/* Final de sessió */
.finish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;width:100%;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:10px;padding:12px 16px;font-size:15px}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Escales i historial */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{min-width:0}
.li .t div:first-child{font-weight:600;font-size:14px}
.li select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 8px;max-width:180px;font-size:13px}
.num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
/* Cos */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .v small{font-size:16px;font-weight:500;color:var(--muted);margin-left:2px}
.tile .r{font-size:12.5px}
.tile .r.ok{color:var(--ok)} .tile .r.warn{color:var(--warn)} .tile .r.bad{color:var(--bad)}
.tile.wide{grid-column:1/-1}
.spark{width:100%;height:56px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:15}
nav.tabs button{flex:0 1 180px;border:0;background:none;border-radius:10px;padding:8px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-block:4px 8px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.ex-name{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Seccions">
  <button id="tab-forca" data-tab="forca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Força</button>
  <button id="tab-cos" data-tab="cos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12c3-4 13-4 16 0M7 12v6M17 12v6M12 4a2 2 0 1 0 0 4a2 2 0 0 0 0-4M9 18h6"/></svg>Cos</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
/*ENGINE*/

// ═══ Prototip de la v2: només Força i Cos. Les dades es guarden en aquest navegador. ═══
const KEY = "rt2proto:v1";
const TODAY = new Date();
const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const todayIso = iso(TODAY);
const DOW = ["diumenge","dilluns","dimarts","dimecres","dijous","divendres","dissabte"];
const fmt = (v, n = 1) => v == null ? "–" : Number(v).toLocaleString("ca-ES", { minimumFractionDigits: n, maximumFractionDigits: n });
const fmtDate = s => { const [y, m, d] = s.split("-"); return `${+d}/${+m}`; };

// Context real calculat amb les teves curses de Strava (13–19/10/2026): 30,4 km aquesta setmana, 45,0 km de mitjana.
const REAL_CTX = { acwr: 0.67, regularWeeks: 8, source: "ACWR amb km de Strava, 13–19/10" };
const SIM_CTX = { acwr: 1.42, tsb: -15, regularWeeks: 8, source: "fatiga simulada" };

function seed() {
  return {
    v: 1,
    strength: { state: initState(), history: [] },
    body: { entries: [{ date: "2026-10-18", weight: 70.5, waist: 78.5, neck: 36, hip: 93, scaleFat: 16.6, seed: true }] },
    profile: { height: 179.5, sex: "male", dayA: 1, dayB: 4 },
    ui: { tab: "forca", session: null, sim: false },
    draft: {},
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { S = seed(); }
if (!S || S.v !== 1) S = seed();
S.strength.state = withAllPatterns(S.strength.state); // afegeix els isomètrics a un estat antic

// ── Cronòmetre per a les aguantades ──
let timer = null, wakeLock = null, audio = null;
function beep() {
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.25);
  } catch (e) { /* sense so: el cronòmetre funciona igual */ }
}
function startTimer(pattern, i, target) {
  stopTimer(false);
  timer = { pattern, i, target, t0: Date.now(), shown: 0, beeped: false };
  try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
  beep();
  timer.iv = setInterval(() => {
    timer.shown = Math.floor((Date.now() - timer.t0) / 1000);
    const o = document.getElementById(`o-${pattern}-${i}`); if (o) o.textContent = timer.shown;
    if (!timer.beeped && timer.shown >= timer.target) { timer.beeped = true; beep(); }
  }, 250);
}
function stopTimer(keep = true) {
  if (!timer) return null;
  clearInterval(timer.iv);
  const t = timer; timer = null;
  try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null;
  return keep ? t : null;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* sense emmagatzematge: el prototip funciona igual */ } }

function defaultSession() {
  const done = S.strength.history.find(h => h.date === todayIso);
  if (done) return done.type === "A" ? "B" : "A"; // avui ja n'has fet una: la següent és l'altra
  const d = TODAY.getDay();
  if (d === S.profile.dayA) return "A";
  if (d === S.profile.dayB) return "B";
  // el que toca a continuació
  const lastA = S.strength.history.find(h => h.type === "A"), lastB = S.strength.history.find(h => h.type === "B");
  if (!lastA) return "A"; if (!lastB) return "B";
  return lastA.date > lastB.date ? "B" : "A";
}
const sessType = () => S.ui.session || defaultSession();
const ctx = () => S.ui.sim ? SIM_CTX : REAL_CTX;

function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}

// ── Esborrany de la sessió en curs ──
function draftFor(ex) {
  const k = sessType() + ":" + ex.pattern + ":" + ex.level + ":" + ex.sets;
  if (!S.draft[k]) S.draft[k] = ex.plyo ? { quality: null } : { reps: ex.targets.slice(), rir: null, pain: false };
  return S.draft[k];
}

// ═══ Pantalla Força ═══
function renderForca() {
  const type = sessType(), c = ctx();
  const plan = planSession(type, S.strength.state, c);
  const fat = plan.fatigued;
  let h = `<section class="sess">
    <div class="sess-row">
      <div><div class="eyebrow">${DOW[TODAY.getDay()]} ${fmtDate(todayIso)}</div>
        <h2>Sessió ${type} · ${plan.name}</h2></div>
      <div class="seg" role="group" aria-label="Sessió">
        <button id="s-a" data-sess="A" aria-pressed="${type === "A"}">A</button>
        <button id="s-b" data-sess="B" aria-pressed="${type === "B"}">B</button>
      </div>
    </div>
    <div class="ctx">
      <span class="chip ${fat ? "warn" : "ok"}">${fat ? "Fatiga alta" : "Fatiga normal"} · ACWR ${fmt(c.acwr, 2)}${c.tsb != null ? " · TSB " + c.tsb : ""}</span>
      <label class="toggle"><input type="checkbox" id="sim" ${S.ui.sim ? "checked" : ""}> Simula fatiga alta</label>
    </div>
    <div class="small muted">${c.source}. A la v2 sortirà del TSB i l'ACWR reals.</div>
  </section>`;
  const doneToday = S.strength.history.find(x => x.date === todayIso);
  if (doneToday && !S.ui.session) plan.notes.unshift(`Avui ja has fet la sessió ${doneToday.type}. Aquesta és la següent, per a un altre dia.`);
  if (plan.notes.length) h += `<div class="notes">${plan.notes.map(n => `<div class="note${n.startsWith("Avui ja") ? " info" : ""}">${n}</div>`).join("")}</div>`;

  for (const ex of plan.exercises) {
    const d = draftFor(ex);
    const lad = LADDERS[ex.pattern];
    const dots = lad.levels.map((_, i) => `<i class="${i < ex.level ? "done" : i === ex.level ? "now" : ""}"></i>`).join("");
    const unit = ex.unit === "s" ? "s" : ex.unit === "contactes" ? "contactes" : "reps";
    h += `<article class="ex" data-pattern="${ex.pattern}">
      <div class="ex-head"><div><div class="eyebrow">${ex.patternName} · ${ex.muscles}</div>
        <div class="ex-name">${ex.name}</div><div class="ladder" aria-hidden="true">${dots}</div></div>
        <span class="lvl">Nivell ${ex.level + 1} de ${ex.levels}</span></div>
      <details><summary>Com es fa</summary><p class="cue">${ex.cue}</p></details>
      <div class="target">${ex.sets} sèries · rang <b>${rangeLabel(ex)}</b>${ex.rirTarget != null ? ` · deixa'n <b>${ex.rirTarget === 3 ? "3" : "1 o 2"}</b> a la recambra` : " · sense arribar al fracàs, tècnica neta"}</div>`;
    if (ex.plyo) {
      h += `<div class="row"><span class="small muted">Com ha anat?</span><div class="rir" role="group" aria-label="Qualitat">
        <button id="q-${ex.pattern}-ok" data-q="ok" aria-pressed="${d.quality === "ok"}">Neta</button>
        <button id="q-${ex.pattern}-pain" data-q="pain" aria-pressed="${d.quality === "pain"}">Molèstia</button></div></div>`;
    } else {
      const running = i => timer && timer.pattern === ex.pattern && timer.i === i;
      h += `<div class="sets">${d.reps.map((r, i) => `<div class="set ${r >= ex.hi ? "hit" : ""}">
          <span class="lab">Sèrie ${i + 1} · ${unit}</span>
          <div class="step"><button id="m-${ex.pattern}-${i}" data-step="-1" data-i="${i}" aria-label="Menys a la sèrie ${i + 1}">−</button>
          <output id="o-${ex.pattern}-${i}">${running(i) ? timer.shown : r}</output>
          <button id="p-${ex.pattern}-${i}" data-step="1" data-i="${i}" aria-label="Més a la sèrie ${i + 1}">+</button></div>
          ${ex.iso ? `<button class="timer${running(i) ? " on" : ""}" id="t-${ex.pattern}-${i}" data-timer="${i}">${running(i) ? "Atura" : "Cronometra"}</button>` : ""}</div>`).join("")}</div>
        <div class="row"><span class="small muted">${ex.iso ? "A l'última, quant més podies aguantar?" : "A l'última, quantes més en podies fer?"}</span>
          <div class="rir" role="group" aria-label="Marge a l'última sèrie">${[0, 1, 2, 3, 4].map(v => `<button id="r-${ex.pattern}-${v}" data-rir="${v}" aria-pressed="${d.rir === v}">${ex.iso ? ["Res", "5 s", "10 s", "15 s", "20 s+"][v] : v === 4 ? "4+" : v}</button>`).join("")}</div></div>
        <label class="check"><input type="checkbox" id="pain-${ex.pattern}" data-pain ${d.pain ? "checked" : ""}> He notat molèstia</label>`;
    }
    h += `</article>`;
  }

  h += `<section class="finish"><h2>Acabar la sessió</h2>
    <div class="grid2">
      <div class="field"><label for="min">Durada (min)</label><input id="min" type="number" inputmode="numeric" min="5" max="120" value="${S.draft._min ?? 25}"></div>
      <div class="field"><label for="rpe">Esforç de la sessió (0–10)</label><input id="rpe" type="number" inputmode="numeric" min="0" max="10" value="${S.draft._rpe ?? 6}"></div>
    </div>
    <div class="small muted">Càrrega estimada: <b class="num" id="loadv">${strengthLoad(+(S.draft._min ?? 25), +(S.draft._rpe ?? 6))}</b> (minuts × esforç × 0,5), al costat del TRIMP de les curses.</div>
    <button class="btn" id="save">Desa la sessió</button>
  </section>`;

  // Últim resultat
  const last = S.strength.history[0];
  if (last) {
    h += `<section><div class="eyebrow" style="margin-bottom:8px">Última sessió · ${fmtDate(last.date)} · sessió ${last.type}</div><div class="list">${last.results.map(r =>
      `<div class="li"><div class="t"><div>${r.name}</div><div class="small muted">${r.reps ? r.reps.join(" · ") : r.quality === "ok" ? "Neta" : "Molèstia"}${r.rirLast != null ? " · RIR " + r.rirLast : ""}</div></div></div>
       <div class="verdict ${r.verdict.action}" style="margin:0 14px 10px">${r.verdict.msg}</div>`).join("")}</div></section>`;
  }

  // Escales: nivell actual de cada moviment, editable per calibrar
  h += `<section><div class="eyebrow" style="margin-bottom:8px">Nivell de cada moviment</div><div class="list">${PATTERNS.map(p => {
    const lad = LADDERS[p], st = S.strength.state[p];
    return `<div class="li"><div class="t"><div>${lad.name}</div><div class="small muted">${lad.muscles}</div></div>
      <select id="lvl-${p}" data-lvl="${p}" aria-label="Nivell de ${lad.name}">${lad.levels.map((l, i) => `<option value="${i}" ${i === st.level ? "selected" : ""}>${i + 1}. ${l.n}</option>`).join("")}</select></div>`;
  }).join("")}</div><p class="small muted">El primer dia, tria a cada moviment el nivell on et costin les últimes repeticions del rang. Després l'app el puja i el baixa sola.</p></section>`;

  if (S.strength.history.length > 1) {
    h += `<section><div class="eyebrow" style="margin-bottom:8px">Historial</div><div class="list">${S.strength.history.slice(0, 12).map(x =>
      `<div class="li"><div class="t"><div>${fmtDate(x.date)} · sessió ${x.type}</div><div class="small muted">${x.minutes} min · esforç ${x.rpe}</div></div><span class="num">${x.load}</span></div>`).join("")}</div></section>`;
  }
  return h;
}

function saveSession() {
  const running = stopTimer();
  if (running) { const ex0 = planSession(sessType(), S.strength.state, ctx()).exercises.find(e => e.pattern === running.pattern); if (ex0) draftFor(ex0).reps[running.i] = running.shown; }
  const type = sessType(), c = ctx();
  const plan = planSession(type, S.strength.state, c);
  let st = S.strength.state;
  const results = [];
  for (const ex of plan.exercises) {
    const d = draftFor(ex);
    if (ex.plyo && !d.quality) { toast(`Marca com ha anat: ${ex.name}`); return; }
    const res = ex.plyo ? { quality: d.quality } : { reps: d.reps, rirLast: d.rir, pain: d.pain };
    const out = applyResult(st, ex.pattern, res, { fatigued: plan.fatigued });
    st = out.state;
    results.push({ pattern: ex.pattern, name: ex.name, level: ex.level, ...res, verdict: out.verdict });
  }
  const minutes = Math.max(1, +document.getElementById("min").value || 25);
  const rpe = Math.min(10, Math.max(0, +document.getElementById("rpe").value || 0));
  S.strength.state = st;
  S.strength.history.unshift({ date: todayIso, type, minutes, rpe, load: strengthLoad(minutes, rpe), fatigued: plan.fatigued, results });
  S.draft = {};
  S.ui.session = null;
  save(); render(); window.scrollTo(0, 0);
  const ups = results.filter(r => r.verdict.action === "up").length;
  toast(ups ? `Sessió desada. Puges de nivell en ${ups} moviment${ups > 1 ? "s" : ""}.` : "Sessió desada.");
}

// ═══ Pantalla Cos ═══
function spark(entries) {
  const pts = entries.filter(e => e.weight > 0).sort((a, b) => a.date.localeCompare(b.date)).slice(-30);
  if (pts.length < 2) return `<div class="small muted">La línia del pes apareix a partir de la segona pesada.</div>`;
  const xs = pts.map(p => Date.parse(p.date)), ys = pts.map(p => p.weight);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys) - 0.3, y1 = Math.max(...ys) + 0.3;
  const X = x => 4 + (x - x0) / (x1 - x0 || 1) * 292, Y = y => 50 - (y - y0) / (y1 - y0 || 1) * 44;
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)} ${Y(p.weight).toFixed(1)}`).join("");
  const lx = X(xs.at(-1)), ly = Y(ys.at(-1));
  return `<svg class="spark" viewBox="0 0 300 56" preserveAspectRatio="none" role="img" aria-label="Evolució del pes">
    <line x1="0" x2="300" y1="${Y((y0 + y1) / 2)}" y2="${Y((y0 + y1) / 2)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx}" cy="${ly}" r="3.5" fill="var(--accent)"/></svg>
    <div class="small muted">${fmtDate(pts[0].date)} – ${fmtDate(pts.at(-1).date)} · ${fmt(Math.min(...ys))}–${fmt(Math.max(...ys))} kg</div>`;
}

function renderCos() {
  const P = S.profile, E = S.body.entries;
  const s = bodySummary(E, { height: P.height, sex: P.sex }, todayIso);
  const tr = s.trend;
  let h = `<section class="sess"><div class="eyebrow">Alçada ${fmt(P.height)} cm</div><h2>Cos</h2></section>`;
  if (s.signal) h += `<div class="note">${s.signal.text}</div>`;
  h += `<div class="tiles">
    <div class="tile wide"><div class="eyebrow">Pes · mitjana de 7 dies</div>
      <div class="v">${fmt(s.weight)}<small>kg</small></div>
      <div class="r muted">${tr ? `${tr.delta > 0 ? "+" : ""}${fmt(tr.delta)} kg en 4 setmanes (${tr.perWeek > 0 ? "+" : ""}${fmt(tr.perWeek, 2)} kg/setmana)` : `${s.weightN} pesada${s.weightN === 1 ? "" : "es"} aquesta setmana · la tendència surt amb 4 setmanes de dades`}</div>
      ${spark(E)}</div>
    <div class="tile"><div class="eyebrow">Cintura / alçada</div><div class="v">${fmt(s.waistHeight, 2)}</div>
      <div class="r ${s.waistHeightRead ? s.waistHeightRead.level : ""}">${s.waistHeightRead ? s.waistHeightRead.text : "Falta la cintura"}</div></div>
    <div class="tile"><div class="eyebrow">Cintura / maluc</div><div class="v">${fmt(s.waistHip, 2)}</div>
      <div class="r ${s.waistHipRead ? s.waistHipRead.level : ""}">${s.waistHipRead ? s.waistHipRead.text : "Opcional: afegeix el maluc"}</div></div>
    <div class="tile"><div class="eyebrow">Greix · Marina</div><div class="v">${fmt(s.navyFat)}<small>%</small></div>
      <div class="r muted">Bàscula: ${s.scaleFat != null ? fmt(s.scaleFat) + " %" : "–"}</div></div>
    <div class="tile"><div class="eyebrow">Massa magra</div><div class="v">${fmt(s.lean)}<small>kg</small></div>
      <div class="r muted">Pes × (1 − greix Marina)</div></div>
    <div class="tile wide"><div class="eyebrow">Proteïna d'avui</div><div class="v">${s.protein ? s.protein.g : "–"}<small>g</small></div>
      <div class="r muted">${s.protein ? `1,6 g per kg · rang ${s.protein.lo}–${s.protein.hi} g, repartida en 3–4 àpats` : "Registra el pes"}</div></div>
  </div>
  <form class="finish" id="bodyform" novalidate><h2>Nova mesura</h2>
    <div class="grid2">
      <div class="field"><label for="b-date">Data</label><input id="b-date" type="date" value="${todayIso}" max="${todayIso}"></div>
      <div class="field"><label for="b-weight">Pes (kg)</label><input id="b-weight" type="number" inputmode="decimal" step="0.1" min="30" max="200" placeholder="70,5"></div>
    </div>
    <div class="grid3">
      <div class="field"><label for="b-waist">Cintura (cm)</label><input id="b-waist" type="number" inputmode="decimal" step="0.5" min="40" max="200" placeholder="78,5"></div>
      <div class="field"><label for="b-neck">Coll (cm)</label><input id="b-neck" type="number" inputmode="decimal" step="0.5" min="20" max="80" placeholder="36"></div>
      <div class="field"><label for="b-hip">Maluc (cm)</label><input id="b-hip" type="number" inputmode="decimal" step="0.5" min="50" max="200" placeholder="93"></div>
    </div>
    <div class="field"><label for="b-scale">% greix de la bàscula (opcional)</label><input id="b-scale" type="number" inputmode="decimal" step="0.1" min="3" max="60" placeholder="16,6"></div>
    <div class="small muted">Pesa't al matí, en dejú. La cintura, a l'altura del melic després d'expirar. Omple només el que hagis mesurat.</div>
    <button class="btn" type="submit" id="b-save">Desa la mesura</button>
  </form>
  <section><div class="eyebrow" style="margin-bottom:8px">Mesures</div><div class="list">${E.slice().sort((a, b) => b.date.localeCompare(a.date)).map((e, i) =>
    `<div class="li"><div class="t"><div>${fmtDate(e.date)}${e.seed ? " · les mesures que em vas donar" : ""}</div>
      <div class="small muted">${[e.weight && fmt(e.weight) + " kg", e.waist && "cintura " + fmt(e.waist), e.neck && "coll " + fmt(e.neck), e.hip && "maluc " + fmt(e.hip), e.scaleFat && "bàscula " + fmt(e.scaleFat) + " %"].filter(Boolean).join(" · ")}</div></div>
      <button class="btn ghost" id="del-${e.date}-${i}" data-del="${e.date}" data-i="${i}" aria-label="Esborra la mesura del ${fmtDate(e.date)}" style="padding:6px 10px;font-size:13px">Esborra</button></div>`).join("") || `<div class="li muted">Encara no hi ha mesures.</div>`}</div></section>`;
  return h;
}

function saveBody(ev) {
  ev.preventDefault();
  const num = id => { const v = document.getElementById(id).value.replace(",", "."); return v === "" ? null : +v; };
  const e = { date: document.getElementById("b-date").value || todayIso,
    weight: num("b-weight"), waist: num("b-waist"), neck: num("b-neck"), hip: num("b-hip"), scaleFat: num("b-scale") };
  const bad = [["weight", 30, 200, "El pes"], ["waist", 40, 200, "La cintura"], ["neck", 20, 80, "El coll"], ["hip", 50, 200, "El maluc"], ["scaleFat", 3, 60, "El % de greix"]]
    .find(([k, lo, hi]) => e[k] != null && !(e[k] >= lo && e[k] <= hi));
  if (bad) { toast(`${bad[3]} ha d'estar entre ${bad[1]} i ${bad[2]}.`); return; }
  if (["weight", "waist", "neck", "hip", "scaleFat"].every(k => e[k] == null)) { toast("Omple almenys una mesura."); return; }
  for (const k of Object.keys(e)) if (e[k] == null) delete e[k];
  S.body.entries.push(e); save(); render(); toast("Mesura desada.");
}

// ═══ Render i esdeveniments ═══
function render() {
  const app = document.getElementById("app");
  app.innerHTML = `<header class="top"><div class="brand">Run<span>Tracker</span></div>
    <div class="proto">Prototip de la v2<br>només Força i Cos</div></header>` +
    (S.ui.tab === "cos" ? renderCos() : renderForca()) +
    `<div class="foot">Les dades d'aquest prototip només es guarden en aquest navegador.</div>`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.ui.tab ? "page" : "false"));
  const f = document.getElementById("bodyform"); if (f) f.addEventListener("submit", saveBody);
}

document.addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.tab) { S.ui.tab = b.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
  if (b.dataset.sess) { S.ui.session = b.dataset.sess; save(); render(); return; }
  if (b.id === "save") { saveSession(); return; }
  if (b.dataset.del) {
    const sorted = S.body.entries.slice().sort((x, y) => y.date.localeCompare(x.date));
    const target = sorted[+b.dataset.i]; S.body.entries = S.body.entries.filter(e => e !== target);
    save(); render(); toast("Mesura esborrada."); return;
  }
  const card = b.closest(".ex"); if (!card) return;
  const plan = planSession(sessType(), S.strength.state, ctx());
  const ex = plan.exercises.find(e => e.pattern === card.dataset.pattern); const d = draftFor(ex);
  if (b.dataset.timer != null) {
    const i = +b.dataset.timer;
    if (timer && timer.pattern === ex.pattern && timer.i === i) { const t = stopTimer(); d.reps[i] = Math.min(300, t.shown); }
    else startTimer(ex.pattern, i, ex.targets[i]);
  }
  else if (b.dataset.step) { const i = +b.dataset.i; d.reps[i] = Math.max(0, Math.min(ex.unit === "s" ? 300 : 60, d.reps[i] + (+b.dataset.step) * (ex.unit === "s" ? 5 : 1))); }
  else if (b.dataset.rir != null) d.rir = d.rir === +b.dataset.rir ? null : +b.dataset.rir;
  else if (b.dataset.q) d.quality = d.quality === b.dataset.q ? null : b.dataset.q;
  save(); const y = window.scrollY; render(); window.scrollTo(0, y);
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.id === "sim") { S.ui.sim = t.checked; save(); render(); return; }
  if (t.dataset.lvl) { const p = t.dataset.lvl; S.strength.state[p] = { level: +t.value, topStreak: 0, lowStreak: 0, cleanCount: 0, lastReps: null }; S.draft = {}; save(); render(); toast(`${LADDERS[p].name}: nivell ${+t.value + 1}.`); return; }
  if (t.dataset.pain != null) { const card = t.closest(".ex"); const plan = planSession(sessType(), S.strength.state, ctx()); const ex = plan.exercises.find(e => e.pattern === card.dataset.pattern); draftFor(ex).pain = t.checked; save(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "min" || ev.target.id === "rpe") {
    S.draft["_" + ev.target.id] = +ev.target.value; save();
    const l = document.getElementById("loadv"); if (l) l.textContent = strengthLoad(+document.getElementById("min").value, +document.getElementById("rpe").value);
  }
});
render();
</script>
